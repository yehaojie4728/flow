# FlowGap Experiment Plan v1
# Generated by docs/prompts/03_codex_first_patch_plan.md

meta:
  target_venue: SoCC 2026 Full Research Paper
  total_experiments: 11
  total_research_questions: 8

# ---------------------------------------------------------------------------
# RQ1: Does Ascend memcpy traffic have predictable burst-gap structure?
# ---------------------------------------------------------------------------
rq1:
  title: "Traffic Predictability Characterization"
  claim: C3 (Traffic structure claim)
  status: NEED_TRACE
  experiments:
    - id: rq1_gap_distribution
      description: "Characterize burst duration and gap duration distributions per workload and per path"
      input: Real Ascend trace (NEED_TRACE)
      method: Offline trace analysis
      metrics:
        - burst_duration_cdf
        - gap_duration_cdf
        - per_path_gap_cdf
        - autocorrelation_lag
        - iteration_aligned_correlation
      dimensions:
        - {name: direction, values: [H2D, D2H, D2D]}
        - {name: platform, values: [910A, 910B]}
        - {name: path, values: [local_numa, cross_numa, inter_fabric]}
      baselines: []
      output:
        figures: [8, 9, 10]
        tables: [3]
      duration_estimate: "1 day (trace collected)"

    - id: rq1_oracle_upper_bound
      description: "Compute oracle probing upper bound: max safe probes possible with perfect gap knowledge"
      input: Same trace
      method: Offline: for each T_probe in [50us, 500us, 5000us, 10000us], count windows where gap >= T_probe + margin
      metrics:
        - oracle_safe_ratio
        - oracle_probe_count_vs_actual
      dimensions:
        - {name: probe_size_us, values: [50, 500, 5000, 10000]}
      baselines: []
      output:
        figures: [4]
      duration_estimate: "included in rq1_gap_distribution"

# ---------------------------------------------------------------------------
# RQ2: How accurate is FlowGap safe-window prediction?
# ---------------------------------------------------------------------------
rq2:
  title: "Safe-Window Prediction Accuracy"
  claim: C4 (Safe-window prediction claim)
  status: NEED_EXPERIMENT
  experiments:
    - id: rq2_multi_horizon_accuracy
      description: "Evaluate predictor at each horizon: precision, recall, false-safe rate"
      input: Real Ascend trace + synthetic trace
      method: Trace replay with sliding window train/test split (80/20 by time)
      metrics:
        - safe_window_precision
        - safe_window_recall
        - false_safe_rate
        - per_horizon_auc
        - per_horizon_pr_auc
      dimensions:
        - {name: horizon_us, values: [10, 25, 50, 100, 250, 500, 1000, 2000]}
        - {name: path, values: [local_numa, cross_numa]}
        - {name: workload, values: [synthetic, training, inference]}
      baselines:
        - EWMA-only predictor
        - Fixed-window predictor
        - Survival predictor without calibration
        - Oracle gap
      output:
        figures: [11, 12]
      duration_estimate: "2 days (model training + evaluation)"

    - id: rq2_calibration
      description: "Evaluate confidence calibration: reliability diagram, ECE, Brier score"
      input: Model output from rq2_multi_horizon_accuracy
      method: Compare raw vs calibrated probabilities on test set
      metrics:
        - expected_calibration_error
        - brier_score
        - reliability_curve_points
      dimensions:
        - {name: calibration, values: [raw, calibrated]}
      baselines:
        - Survival predictor without calibration
      output:
        figures: [13]
      duration_estimate: "included in rq2_multi_horizon_accuracy"

    - id: rq2_lower_bound_coverage
      description: "Verify gap lower-bound achieves target coverage (95%)"
      input: Model output from rq2_multi_horizon_accuracy
      method: Count fraction of actual gaps >= predicted lower bound
      metrics:
        - gap_lower_bound_coverage
      dimensions:
        - {name: target_coverage, values: [0.90, 0.95, 0.99]}
        - {name: path, values: [all_paths]}
      baselines: []
      output:
        figures: [14]
      duration_estimate: "included in rq2_multi_horizon_accuracy"

    - id: rq2_cold_start
      description: "Measure cold-start cost: events or time until predictor reaches target safe-window precision"
      input: Real Ascend trace + synthetic trace (fresh model, no prior training)
      method: Train model incrementally; measure precision at each step from event 0; find convergence point
      metrics:
        - cold_start_events_to_target_precision
        - cold_start_time_to_target_precision
        - precision_vs_samples_curve
      dimensions:
        - {name: target_precision, values: [0.90, 0.95]}
        - {name: model, values: [ewma_baseline, gbdt_survival]}
        - {name: workload, values: [synthetic, training]}
      baselines:
        - EWMA-only predictor (lower bound — no training needed, but lower precision)
      output:
        figures: [11]    # cold-start panel added to Fig 11
      duration_estimate: "included in rq2_multi_horizon_accuracy"

# ---------------------------------------------------------------------------
# RQ3: Does probe-aware event-driven intervalization outperform fixed windows
#       and raw events?
# ---------------------------------------------------------------------------
rq3:
  title: "Data Representation Ablation"
  claim: C5 (Representation claim)
  status: NEED_EXPERIMENT
  experiments:
    - id: rq3_representation_ablation
      description: "Compare three input representations on prediction accuracy"
      input: Real Ascend trace
      method: Train identical GBDT model on each representation; compare metrics
      representations:
        - {name: fixed_window, params: {bin_us: [50, 100, 500, 1000]}}
        - {name: raw_event, params: {k_events: [10, 20, 50]}}
        - {name: probe_aware_intervalization, params: {T_probe_min_us: [50, 500]}}
      metrics:
        - false_safe_rate
        - safe_window_precision
        - safe_window_recall
        - model_inference_time_us
      dimensions:
        - {name: representation, values: [fixed_window, raw_event, probe_aware]}
      baselines: []
      output:
        figures: [15, 16]
        tables: [4]
      duration_estimate: "2 days (3 representations × parameter sweeps)"

# ---------------------------------------------------------------------------
# RQ4: Does FlowGap reduce probe/memcpy burst overlap?
# ---------------------------------------------------------------------------
rq4:
  title: "Probe Scheduling Effectiveness"
  claim: C6 (Scheduling claim)
  status: NEED_EXPERIMENT
  experiments:
    - id: rq4_overlap_reduction
      description: "Compare overlap ratio across all scheduling strategies at equal probe budget"
      input: Real Ascend trace
      method: Trace replay; control for equal probe count and equal probe byte volume
      metrics:
        - overlap_ratio
        - safe_probing_ratio
        - harmful_probe_count
        - cancellation_rate
        - downgrade_rate
        - per_path_overlap
      dimensions:
        - {name: probe_budget, values: [low, medium, high]}
        - {name: workload, values: [training, inference, checkpoint]}
      baselines:
        - Fixed probing
        - Random probing
        - Threshold probing (HostDiagV2 style)
        - EWMA-only probing
        - FlowGap
        - Oracle gap-aware probing
      output:
        figures: [17, 18, 19]
      duration_estimate: "1 day (all baselines on same trace)"

# ---------------------------------------------------------------------------
# RQ5: Does FlowGap reduce AI workload interference?
# ---------------------------------------------------------------------------
rq5:
  title: "Workload Interference"
  claim: C7 (Workload impact claim)
  status: NEED_EXPERIMENT
  requires_ascend_online: true
  experiments:
    - id: rq5_training_slowdown
      description: "Measure training iteration slowdown under different probing strategies"
      input: Training workload running on Ascend + probe scheduler
      method: Run workload with each probing strategy; measure iteration times
      metrics:
        - iteration_slowdown
        - p95_iteration_time
        - p99_iteration_time
        - throughput_loss (samples/sec)
        - memcpy_latency_inflation (avg, p95, p99)
      dimensions:
        - {name: workload, values: [cnn_training, transformer_training]}
      baselines:
        - No probing (lower bound)
        - Fixed probing
        - Threshold probing
        - FlowGap
        - Oracle probing
      output:
        figures: [20, 21]
      duration_estimate: "3 days (each workload × 5 baselines × repetitions)"

    - id: rq5_collective_impact
      description: "Measure HCCL collective latency under probing"
      input: Multi-NPU collective workload (all-reduce, all-to-all)
      method: Same as above, focused on collective operations
      metrics:
        - collective_p95_latency
        - collective_p99_latency
      dimensions:
        - {name: collective_op, values: [all_reduce, all_to_all, reduce_scatter]}
      baselines: [No probing, Fixed probing, Threshold probing, FlowGap, Oracle probing]
      output:
        figures: [22]
      duration_estimate: "included in rq5_training_slowdown"

    - id: rq5_checkpoint_impact
      description: "Measure checkpoint save/load delay under probing"
      input: Checkpoint workload
      method: Same framework
      metrics:
        - checkpoint_save_time
        - checkpoint_load_time
      baselines: [No probing, Fixed probing, Threshold probing, FlowGap]
      output:
        figures: [23]
      duration_estimate: "included in rq5_training_slowdown"

# ---------------------------------------------------------------------------
# RQ6: Does FlowGap preserve detection utility?
# ---------------------------------------------------------------------------
rq6:
  title: "Detection Utility Under Lower Probing Interference"
  claim: C8 (Detection utility claim)
  status: NEED_EXPERIMENT
  requires_ascend_online: true
  experiments:
    - id: rq6_fault_detection
      description: "Inject faults and measure detection recall/latency under different probing strategies"
      input: Ascend workload + fault injector
      method: Inject each fault type; run each probing strategy; measure detection performance
      fault_scenarios:
        - {name: npu_pcie_bw_decrease, method: "background memcpy throttling", signal: "bandwidth probe detects drop"}
        - {name: memory_channel_contention, method: "background memory benchmark", signal: "latency probe detects increase"}
        - {name: cpu_interconnect_contention, method: "remote NUMA load", signal: "cross-NUMA probe detects slowdown"}
        - {name: npu_interconnect_degraded, method: "disable HCCS link or config fallback", signal: "D2D probe detects change"}
        - {name: cross_numa_misbinding, method: "remote NUMA allocation", signal: "path pattern change detected"}
        - {name: frequent_checkpoint, method: "increase checkpoint frequency", signal: "predictor adapts confidence"}
        - {name: small_batch_many_flows, method: "reduce batch size", signal: "short horizon prediction"}
        - {name: workload_drift, method: "switch workload mid-run", signal: "drift detector triggers conservative mode"}
      metrics:
        - detection_recall
        - detection_latency
        - false_positive_rate
        - useful_probe_ratio
        - workload_slowdown_during_detection
      baselines: [Fixed probing, Threshold probing, FlowGap, FlowGap with failure-aware fallback, Oracle]
      output:
        figures: [24, 25, 26]
        tables: [5]
      duration_estimate: "5 days (8 fault scenarios × 5 baselines × repetitions)"

# ---------------------------------------------------------------------------
# RQ7: Is FlowGap robust to async uncertainty, event loss, and workload drift?
# ---------------------------------------------------------------------------
rq7:
  title: "Robustness"
  claim: C9 (Robustness claim)
  status: NEED_EXPERIMENT
  experiments:
    - id: rq7_async_uncertainty
      description: "Evaluate predictor under varying async visibility"
      input: Synthetic trace with controlled async_ratio and sync_visibility
      method: Trace replay; vary async parameters
      metrics:
        - false_safe_rate
        - safe_window_recall
        - conservative_vs_estimated_safe_window_count
      dimensions:
        - {name: async_mode, values: [sync_only, async_with_sync, async_no_sync, high_stream_concurrency]}
      baselines: []
      output:
        figures: [29]
      duration_estimate: "1 day"

    - id: rq7_event_loss
      description: "Evaluate predictor under ring buffer drops"
      input: Real trace with synthetic dropout
      method: Replay trace; randomly drop events at controlled rate
      metrics:
        - false_safe_rate
        - data_quality_confidence
        - probe_count_auto_reduction
      dimensions:
        - {name: drop_rate, values: [0.0, 0.01, 0.05, 0.10, 0.20]}
      baselines: []
      output:
        figures: [27]
      duration_estimate: "1 day"

    - id: rq7_workload_drift
      description: "Evaluate predictor recovery after workload pattern change"
      input: Multi-workload trace (concatenated)
      method: Replay trace; switch workload at time T; measure recovery
      metrics:
        - drift_detection_delay
        - drift_recovery_time
        - conservative_mode_duration
        - precision_timeline
      dimensions:
        - {name: drift_type, values: [batch_size_change, workload_switch, checkpoint_phase]}
      baselines: []
      output:
        figures: [28]
      duration_estimate: "1 day"

# ---------------------------------------------------------------------------
# RQ8: What is FlowGap system overhead?
# ---------------------------------------------------------------------------
rq8:
  title: "System Overhead"
  claim: C10 (System overhead claim)
  status: NEED_EXPERIMENT
  requires_ascend_online: true
  experiments:
    - id: rq8_overhead_measurement
      description: "Measure CPU, memory, and latency overhead at each pipeline stage"
      input: Live Ascend system
      method: Progressive enablement; measure at each stage
      stages:
        - {name: disabled, description: "baseline (no FlowGap)"}
        - {name: ebpf_only, description: "eBPF monitor only (no predictor/prober)"}
        - {name: monitor_predictor, description: "monitor + predictor (no prober)"}
        - {name: full_stack, description: "monitor + predictor + prober"}
        - {name: worst_case, description: "continuous predictor + max budget probing"}
      metrics:
        - cpu_core_usage
        - memory_mb
        - avg_event_processing_latency
        - p99_event_processing_latency
        - end_to_end_safe_window_publication_latency
        - baseline_workload_overhead (monitoring-only)
      dimensions:
        - {name: stage, values: [disabled, ebpf_only, monitor_predictor, full_stack, worst_case]}
      baselines: []
      output:
        figures: [30, 31]
        tables: [6]
      duration_estimate: "1 day"

# ---------------------------------------------------------------------------
# Sensitivity Analysis
# ---------------------------------------------------------------------------
sensitivity:
  title: "Parameter Sensitivity"
  claim: null  # Supports all claims
  status: NEED_EXPERIMENT
  experiments:
    - id: sensitivity_confidence_threshold
      description: "Sweep eta from 0.80 to 0.99; measure false-safe rate vs recall tradeoff"
      parameters:
        - {name: eta, range: [0.80, 0.99, 0.01]}
      metrics: [false_safe_rate, safe_window_recall]
      output:
        figures: [32]
      duration_estimate: "included with rq2"

    - id: sensitivity_safety_margin
      description: "Sweep margin from 0 to 500us; measure slowdown vs probe count tradeoff"
      parameters:
        - {name: margin_us, range: [0, 500, 25]}
      metrics: [workload_slowdown, probe_count]
      output:
        figures: [33]
      duration_estimate: "included with rq5"

    - id: sensitivity_history_length
      description: "Sweep K from 5 to 200; measure prediction accuracy"
      parameters:
        - {name: K, values: [5, 10, 20, 50, 100, 200]}
      metrics: [safe_window_precision, safe_window_recall]
      output:
        figures: [34]
      duration_estimate: "included with rq2"

    - id: sensitivity_probe_size
      description: "Sweep probe size from 4KB to 256MB; measure safe-window availability"
      parameters:
        - {name: probe_size_mb, values: [0.004, 0.016, 0.064, 0.256, 1, 4, 16, 64, 128, 256]}
      metrics: [safe_window_availability_pct]
      output:
        figures: [35]
      duration_estimate: "included with rq1"

# ---------------------------------------------------------------------------
# Execution order (total: ~18 days wall-clock with Ascend access)
# ---------------------------------------------------------------------------
execution_order:
  offline_phase:
    - rq1_gap_distribution          # 1 day (need trace data)
    - rq2_multi_horizon_accuracy    # 2 days (can start with synthetic while waiting)
    - rq2_cold_start                # included in rq2
    - rq3_representation_ablation   # 2 days
    - rq4_overlap_reduction         # 1 day
    - rq7_async_uncertainty         # 1 day
    - rq7_event_loss                # 1 day
    - rq7_workload_drift            # 1 day
  online_phase:
    - rq5_training_slowdown         # 3 days
    - rq6_fault_detection           # 5 days
    - rq8_overhead_measurement      # 1 day
  final:
    - sensitivity                   # included in above
    - figure_generation             # 1 day
